schema_version: '1.0'
organization: dfg-desbi
audit:
  date: '2026-09-01'
  scope: Public repositories, the official DeSBi website, publication code links, and renewal materials.
  caveat: A public repository and compatible licence do not by themselves establish authority to brand a fork as
    an official DeSBi release. Maintainer and institutional approval remains required.
status_definitions:
  fork_now: Public, explicitly licensed and technically suitable for a first-wave fork, subject to maintainer approval
    and release-quality checks.
  owner_approval: Technically suitable, but governance or institutional ownership requires explicit approval before
    an official fork.
  cleanup_first: A public codebase exists, but licensing, provenance or packaging blocks an official release.
  publish_required: The renewal names a reusable output, but no unambiguous public repository was located in this
    audit.
  do_not_fork: Superseded, external or otherwise unsuitable for DeSBi branding.
